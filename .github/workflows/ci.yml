name: Assessment CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_SERVER: demoooo.azurecr.io

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
    steps:
      - name: Checkout source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: detect
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_SHA: ${{ github.sha }}
          GH_BEFORE: ${{ github.event.before }}
          GH_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/detect_changes.py

  build-frontend:
    name: Build frontend image
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build frontend
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          short_sha="${IMAGE_TAG::7}"
          docker build --tag "$ACR_SERVER/optisigns-frontend:$short_sha" ./frontend

      - name: Log in to ACR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ACR_USERNAME"
          test -n "$ACR_PASSWORD"
          printf '%s' "$ACR_PASSWORD" | docker login "$ACR_SERVER" --username "$ACR_USERNAME" --password-stdin

      - name: Push frontend
        id: push
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          short_sha="${IMAGE_TAG::7}"
          image="$ACR_SERVER/optisigns-frontend:$short_sha"
          docker push "$image"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er '.digest')
          digest_pattern='^sha256:[0-9a-f]{64}$'
          [[ "$digest" =~ $digest_pattern ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Log out of ACR
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker logout "$ACR_SERVER"

  build-backend:
    name: Build backend image
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build backend
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          short_sha="${IMAGE_TAG::7}"
          docker build --tag "$ACR_SERVER/optisigns-backend:$short_sha" ./backend

      - name: Log in to ACR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ACR_USERNAME"
          test -n "$ACR_PASSWORD"
          printf '%s' "$ACR_PASSWORD" | docker login "$ACR_SERVER" --username "$ACR_USERNAME" --password-stdin

      - name: Push backend
        id: push
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          short_sha="${IMAGE_TAG::7}"
          image="$ACR_SERVER/optisigns-backend:$short_sha"
          docker push "$image"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er '.digest')
          digest_pattern='^sha256:[0-9a-f]{64}$'
          [[ "$digest" =~ $digest_pattern ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Log out of ACR
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker logout "$ACR_SERVER"

  update-gitops:
    name: Update GitOps images
    needs: [changes, build-frontend, build-backend]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.changes.result == 'success' &&
      (needs.build-frontend.result == 'success' || needs.build-backend.result == 'success') &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: assessment-gitops
      cancel-in-progress: false
    steps:
      - name: Checkout GitOps branch
        uses: actions/checkout@v4
        with:
          ref: gitops
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false

      - name: Install pinned Kustomize
        run: |
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Update, validate and push image references
        env:
          BACKEND_DIGEST: ${{ needs.build-backend.outputs.digest }}
          BACKEND_RESULT: ${{ needs.build-backend.result }}
          FRONTEND_DIGEST: ${{ needs.build-frontend.outputs.digest }}
          FRONTEND_RESULT: ${{ needs.build-frontend.result }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          digest_pattern='^sha256:[0-9a-f]{64}$'
          [[ "$SOURCE_SHA" =~ $sha_pattern ]]
          short_sha="${SOURCE_SHA::7}"
          update_backend=false
          update_frontend=false

          if [[ "$BACKEND_RESULT" == success ]]; then
            [[ "$BACKEND_DIGEST" =~ $digest_pattern ]]
            update_backend=true
          fi
          if [[ "$FRONTEND_RESULT" == success ]]; then
            [[ "$FRONTEND_DIGEST" =~ $digest_pattern ]]
            update_frontend=true
          fi

          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "Refusing GitOps update: source commit is not an ancestor of main."
            exit 1
          }
          if ! git diff --quiet "$SOURCE_SHA" origin/main -- backend/ .github/workflows/ scripts/; then
            echo "Skip stale backend image: a newer relevant change is on main."
            update_backend=false
          fi
          if ! git diff --quiet "$SOURCE_SHA" origin/main -- frontend/ .github/workflows/ scripts/; then
            echo "Skip stale frontend image: a newer relevant change is on main."
            update_frontend=false
          fi
          if [[ "$update_backend" == false && "$update_frontend" == false ]]; then
            echo "No current image update remains."
            exit 0
          fi

          cd apps/assessment
          kustomize build . > "$RUNNER_TEMP/assessment-before.yaml"
          backend="$ACR_SERVER/optisigns-backend:$short_sha@$BACKEND_DIGEST"
          frontend="$ACR_SERVER/optisigns-frontend:$short_sha@$FRONTEND_DIGEST"
          old_backend=$(grep -F "image: $ACR_SERVER/optisigns-backend:" "$RUNNER_TEMP/assessment-before.yaml" | sort -u)
          old_frontend=$(grep -F "image: $ACR_SERVER/optisigns-frontend:" "$RUNNER_TEMP/assessment-before.yaml" | sort -u)
          [[ $(printf '%s\n' "$old_backend" | wc -l) -eq 1 ]]
          [[ $(printf '%s\n' "$old_frontend" | wc -l) -eq 1 ]]

          images=()
          [[ "$update_backend" == true ]] && images+=("$ACR_SERVER/optisigns-backend=$backend")
          [[ "$update_frontend" == true ]] && images+=("$ACR_SERVER/optisigns-frontend=$frontend")
          kustomize edit set image "${images[@]}"
          kustomize build . > "$RUNNER_TEMP/assessment-rendered.yaml"
          if [[ "$update_backend" == true ]]; then
            test "$(grep -Fc "image: $backend" "$RUNNER_TEMP/assessment-rendered.yaml")" -eq 2
          else
            test "$(grep -Fc "$old_backend" "$RUNNER_TEMP/assessment-rendered.yaml")" -eq 2
          fi
          if [[ "$update_frontend" == true ]]; then
            test "$(grep -Fc "image: $frontend" "$RUNNER_TEMP/assessment-rendered.yaml")" -eq 1
          else
            test "$(grep -Fc "$old_frontend" "$RUNNER_TEMP/assessment-rendered.yaml")" -eq 1
          fi
          if grep -Eq '^kind: Secret$' "$RUNNER_TEMP/assessment-rendered.yaml"; then
            echo "Unexpected Secret in GitOps manifests."
            exit 1
          fi

          git add kustomization.yaml
          if git diff --cached --quiet; then
            echo "Image references are already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "gitops: deploy $short_sha"

          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "Refusing GitOps push: source commit is no longer an ancestor of main."
            exit 1
          }
          if [[ "$update_backend" == true ]] && ! git diff --quiet "$SOURCE_SHA" origin/main -- backend/ .github/workflows/ scripts/; then
            echo "Skip GitOps push: backend image became stale during validation."
            exit 0
          fi
          if [[ "$update_frontend" == true ]] && ! git diff --quiet "$SOURCE_SHA" origin/main -- frontend/ .github/workflows/ scripts/; then
            echo "Skip GitOps push: frontend image became stale during validation."
            exit 0
          fi
          git push origin HEAD:gitops
