apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: optisigns-assessment
spec:
  selector: {app: backend}
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: optisigns-assessment
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels:
        app: backend
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: backend-keyvault
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: demoooo.azurecr.io/optisigns-backend:7de33692047c289cdbf1640082a42bf0f5983420@sha256:9f368f14fbbc43e395c4a7e3c7d21f5788ad62d7fe939f67620c3a6ca84af77f
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: {name: backend-keyvault-env}
          env:
            - name: AUTH_ENABLED
              value: "true"
            - name: PUBLIC_ORIGIN
              value: https://optisigns-assessment-25dd1b47.southeastasia.cloudapp.azure.com
            - name: PGHOST
              value: postgres.assessment-data.svc.cluster.local
            - name: PGUSER
              value: video_app
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: backend-keyvault-env, key: PGPASSWORD}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, 'sleep 5']
          ports:
            - containerPort: 3000
          startupProbe:
            httpGet: {path: /health/live, port: 3000}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: 3000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 3000}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi, ephemeral-storage: 2Gi}
          volumeMounts:
            - name: uploads
              mountPath: /uploads
            - name: keyvault-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: uploads
          persistentVolumeClaim: {claimName: uploads}
        - name: keyvault-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: backend-keyvault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: optisigns-assessment
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: demoooo.azurecr.io/optisigns-backend:7de33692047c289cdbf1640082a42bf0f5983420@sha256:9f368f14fbbc43e395c4a7e3c7d21f5788ad62d7fe939f67620c3a6ca84af77f
          imagePullPolicy: IfNotPresent
          command: [node, dist/worker.js]
          startupProbe:
            httpGet: {path: /health/live, port: 3001}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: 3001}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 3001}
            periodSeconds: 10
          env:
            - name: PGHOST
              value: postgres.assessment-data.svc.cluster.local
            - name: PGUSER
              value: video_app
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: video-app, key: password}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: '2', memory: 1536Mi}
          volumeMounts:
            - name: uploads
              mountPath: /uploads
      volumes:
        - name: uploads
          persistentVolumeClaim: {claimName: uploads}
