apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: optisigns-assessment
spec:
  clusterIP: 10.96.0.200
  selector:
    app: nfs-server
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  namespace: optisigns-assessment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nfs-server
  template:
    metadata:
      labels:
        app: nfs-server
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: optisigns-assessment-control-plane
      initContainers:
        - name: permissions
          image: busybox:1.37.0
          command: [sh, -c, 'chown 1000:1000 /exports && chmod 0770 /exports']
          volumeMounts:
            - name: data
              mountPath: /exports
      containers:
        - name: nfs
          image: erichough/nfs-server:2.2.1@sha256:1efd4ece380c5ba27479417585224ef857006daa46ab84560a28c1224bc71e9e
          # Bound rpc.mountd descriptor allocation under containerd's high default limit.
          command: [sh, -c, 'ulimit -n 1024; exec /usr/local/bin/entrypoint.sh']
          # Kernel NFS needs mount privileges; restricted to this local storage pod.
          securityContext:
            privileged: true
          env:
            - name: NFS_EXPORT_0
              value: '/exports *(rw,sync,fsid=0,no_subtree_check,root_squash)'
            - name: NFS_DISABLE_VERSION_3
              value: '1'
          ports:
            - containerPort: 2049
          readinessProbe:
            tcpSocket:
              port: 2049
            periodSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: '1'
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /exports
      volumes:
        # Local demo only: survives pod replacement, NOT deletion of the kind node.
        - name: data
          hostPath:
            path: /var/local/optisigns-assessment/uploads
            type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: optisigns-uploads
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  mountOptions: [nfsvers=4.1, hard, timeo=600, retrans=2]
  claimRef:
    namespace: optisigns-assessment
    name: uploads
  nfs:
    server: 10.96.0.200
    path: /
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  namespace: optisigns-assessment
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ''
  volumeName: optisigns-uploads
  resources:
    requests:
      storage: 10Gi
