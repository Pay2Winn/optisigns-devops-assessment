apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: optisigns-assessment
spec:
  selector: {app: backend}
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: optisigns-assessment
spec:
  replicas: 1
  minReadySeconds: 5
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: optisigns-backend:dev4
          imagePullPolicy: Never
          env:
            - name: PGUSER
              value: video_app
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: video-app, key: password}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, 'sleep 5']
          ports:
            - containerPort: 3000
          startupProbe:
            httpGet: {path: /health/live, port: 3000}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: 3000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 3000}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi, ephemeral-storage: 2Gi}
          volumeMounts:
            - name: uploads
              mountPath: /uploads
      volumes:
        - name: uploads
          persistentVolumeClaim: {claimName: uploads}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: optisigns-assessment
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: optisigns-backend:dev4
          imagePullPolicy: Never
          command: [node, dist/worker.js]
          startupProbe:
            httpGet: {path: /health/live, port: 3001}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: 3001}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 3001}
            periodSeconds: 10
          env:
            - name: PGUSER
              value: video_app
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: video-app, key: password}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: '2', memory: 1536Mi}
          volumeMounts:
            - name: uploads
              mountPath: /uploads
      volumes:
        - name: uploads
          persistentVolumeClaim: {claimName: uploads}
